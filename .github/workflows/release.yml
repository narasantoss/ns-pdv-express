name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Rust (estável, toolchain MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Instalar dependências npm
        run: npm ci

      - name: Build do frontend
        run: npm run build

      - name: Build e publicar instalador Windows (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NS PDV Express ${{ github.ref_name }}"
          releaseBody: "Instalador Windows (.exe/.msi) gerado automaticamente pelo pipeline de release."
          releaseDraft: false
          prerelease: false
